# Hyprland config — CachyOS box.
# Bar/launcher/lock/session are ALL Noctalia — no Waybar, no Rofi.
# Keybinds mirror KEYBINDS.md — update that table first, then this file.

$mod = SUPER
$terminal = kitty
$fileManager = thunar
$browser = zen-browser

# --- Autostart ---
# NOTE: "qs -c noctalia-shell" is the v4 (Quickshell) launch command.
# Noctalia v5 dropped Quickshell/Qt entirely -- if the AUR package
# installed is v5, this line is wrong and needs the v5 binary invocation
# instead. Check `noctalia-shell --version` before trusting this, I
# could not confirm which version is current in the AUR.
exec-once = qs -c noctalia-shell
exec-once = wl-paste --watch cliphist store

# --- Monitor (placeholder -- set to your actual output via `hyprctl monitors`) ---
monitor=,preferred,auto,1

# --- Look and feel ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

# --- Keybinds (see KEYBINDS.md) ---
bind = $mod, T, exec, $terminal
bind = $mod, D, exec, qs -c noctalia-shell --launcher
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, F, fullscreen
bind = $mod, Q, killactive
bind = $mod, Tab, exec, qs -c noctalia-shell --lock
# UNVERIFIED: could not confirm the session/logout-panel CLI flag or IPC call for Noctalia v4 -- check `qs -c noctalia-shell --help` before relying on this
bind = $mod, Escape, exec, qs -c noctalia-shell --control-center

bind = $mod, Space, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 50% 50% && hyprctl dispatch centerwindow

bind = $mod, Delete, exec, grim ~/Pictures/$(date +%s).png
bind = , Delete, exec, grim -g "$(slurp)" ~/Pictures/$(date +%s).png

# UNVERIFIED: could not confirm a clipboard-history CLI flag for Noctalia -- check docs before relying on this
bind = $mod, V, exec, qs -c noctalia-shell --launcher

# --- Workspaces ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
