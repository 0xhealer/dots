# Hyprland config (hyprlang format) -- used by Hyprland < 0.55, which does
# not read hyprland.lua. functions/07-hyprland.sh deploys whichever matches
# the installed version. Keep in step with hyprland.lua and
# assets/keybindings.txt.
#
# Colours are NOT set here: they come from the wallpaper-driven palette
# (~/.config/theme/theme.conf, rendered by theme-apply).

$mod = SUPER
$terminal = ~/.local/bin/dots-term
$fileManager = thunar
$browser = ~/.local/bin/dots-browser
$theme = ~/.config/theme/theme-apply

# --- Palette (generated from the wallpaper) ---
source = ~/.config/theme/generated/hyprland.conf

# --- Autostart (guarded: a missing optional program can't break the session) ---
exec-once = $theme --restore
exec-once = sh -c 'command -v noctalia >/dev/null && exec noctalia'
exec-once = wl-paste --watch cliphist store
exec-once = sh -c 'command -v vicinae >/dev/null && exec vicinae server'

monitor = , preferred, auto, 1

# --- Look and feel ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 0.88
    inactive_opacity = 0.78
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }
}

# --- Launchers ---
bind = $mod, D, exec, rofi -show drun
bind = $mod, Space, exec, rofi -show drun
bind = $mod SHIFT, D, exec, rofi -show run
bind = $mod SHIFT, Space, exec, rofi -show window
bind = $mod, W, exec, $theme --pick
bind = $mod SHIFT, W, exec, $theme --random

# --- Programs ---
bind = $mod, T, exec, $terminal
bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Return, exec, ghostty
bind = $mod CTRL, Return, exec, foot
bind = $mod, M, exec, spotify
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser

# --- Windows ---
bind = $mod, F, fullscreen
bind = $mod, Q, killactive
bind = $mod, V, togglefloating
bind = $mod, Tab, exec, sh -c 'command -v noctalia >/dev/null && noctalia msg session lock'
bind = $mod, Escape, exec, sh -c 'command -v noctalia >/dev/null && noctalia msg panel-toggle control-center'

# --- Screenshots ---
bind = $mod, Delete, exec, grim ~/Pictures/$(date +%s).png
bind = , Delete, exec, grim -g "$(slurp)" ~/Pictures/$(date +%s).png

# --- Cheatsheet ---
bind = $mod SHIFT, slash, exec, $terminal -e less ~/.config/keybindings.txt

# --- Workspaces ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
