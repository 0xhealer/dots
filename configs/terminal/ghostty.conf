# ghostty. Colours come from the wallpaper-driven palette
# (~/.config/theme/theme.conf -> generated/ghostty, see theme-apply).
# Relative path: resolved from this file, i.e. ~/.config/ghostty/ -> ~/.config/theme/.
config-file = ?../theme/generated/ghostty

font-family = JetBrainsMono Nerd Font
font-size = 11
background-opacity = 0.92
window-padding-x = 6
window-padding-y = 6
window-decoration = false
confirm-close-surface = false
