# kitty -- confirmed terminal (Mod+T / Mod+Return, both compositors).
#
# CLEANED: no hardcoded colors here anymore. Noctalia's built-in
# wallpaper-driven theming (a confirmed active template -- see
# configs/noctalia/settings.json's templates.activeTemplates) writes
# its own generated color scheme directly into kitty's config. Keeping
# a static Catppuccin foreground/background here was fighting that --
# every wallpaper change would regenerate colors that this file then
# silently overrode. Font/opacity/padding stay static since those
# aren't part of the color pipeline.
font_family      JetBrainsMono Nerd Font
font_size        11.0

background_opacity 0.92
window_padding_width 6

confirm_os_window_close 0
