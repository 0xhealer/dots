# kitty -- confirmed terminal (Mod+T / Mod+Return, both compositors).
#
# CLEANED: no hardcoded colors here anymore. Noctalia's built-in
# wallpaper-driven theming writes its own generated color scheme
# directly into kitty's config (see configs/noctalia/config.toml's
# theme.templates.builtin_ids). Keeping a static Catppuccin
# foreground/background here was fighting that. Font/opacity/padding
# stay static since those aren't part of the color pipeline.
font_family      JetBrainsMono Nerd Font
font_size        11.0

background_opacity 0.92
window_padding_width 6

confirm_os_window_close 0

# Fixes the weird title-bar-like row inside the terminal on niri --
# niri doesn't render server-side decorations for kitty the way some
# other compositors might, and without this kitty draws its own title
# area inside the content instead of leaving it to the compositor.
# Standard, well-known kitty setting for tiling-WM use, not
# compositor-specific.
hide_window_decorations yes
