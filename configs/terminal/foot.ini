# foot -- Wayland terminal. Colours come from the wallpaper-driven palette
# (~/.config/theme/theme.conf -> generated/foot.ini, see theme-apply).
include=@HOME@/.config/theme/generated/foot.ini

[main]
font=JetBrainsMono Nerd Font:size=11
pad=6x6
term=xterm-256color

[colors]
alpha=0.92

[cursor]
style=beam
